
server.port=${PORT:8081}
server.address=0.0.0.0

# 로컬 실행용: 프로젝트 루트의 .env 파일(있을 때만)에서 DB_USERNAME 등을 읽습니다. .env는 git에 올라가지 않습니다.
spring.config.import=optional:file:.env[.properties]

# DB_URL이 없으면 프로젝트 폴더의 ./data 에 저장되는 내장 H2 DB로 바로 실행됩니다(설치 불필요).
# MySQL을 쓰려면 DB_URL=jdbc:mysql://localhost:3306/wine_finder?createDatabaseIfNotExist=true 와 계정을 설정하세요.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/wine_finder;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.application.name=wine-finder


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Seoul
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
app.cors-origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:./uploads}

# JWT 로그인 토큰
# JWT_SECRET: HS256 서명 비밀키(32바이트 이상). 반드시 환경 변수나 .env로 넣고 코드·git에는 쓰지 마세요.
app.jwt.secret=${JWT_SECRET:}
# JWT_EXPIRES_SECONDS: 토큰 유효 시간(초). 기본 3600(1시간)
app.jwt.expires-seconds=${JWT_EXPIRES_SECONDS:3600}

# 계정 준비 (앱 시작 시)
# ADMIN_INITIAL_PASSWORD: admin 계정이 없을 때 이 비밀번호로 만듭니다. 비우면 만들지 않고 경고 로그만 남깁니다.
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
# STUDENTS_CSV: 학생 일괄 등록 CSV 경로(loginId,name,initialPassword). 비우면 아무것도 하지 않습니다.
app.students-csv=${STUDENTS_CSV:}
